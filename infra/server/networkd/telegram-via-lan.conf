# Telegram Bot API у МТС (eth1, маршрут по умолчанию) недоступен — алерты Uptime
# Kuma уходят через LAN-шлюз. Ставится как drop-in к netplan-юниту eth0:
#   /etc/systemd/network/10-netplan-eth0.network.d/telegram-via-lan.conf
# Применяется при загрузке; на живом сервере — `ip route add ... via 192.168.1.1`.
# Подсети — официальные диапазоны Telegram (149.154.160.0/20, 91.108.0.0/16).
[Route]
Destination=149.154.160.0/20
Gateway=192.168.1.1

[Route]
Destination=91.108.0.0/16
Gateway=192.168.1.1
