name: gmd-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gmd-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gmd_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gmd_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gmd} -d ${POSTGRES_DB:-gmd_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gmd-redis-dev
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gmd-minio-dev
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: gmd-minio-setup-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio12345} &&
      mc mb --ignore-existing local/gmd-uploads &&
      echo 'bucket gmd-uploads ready'
      "
    restart: 'no'

  adminer:
    image: adminer:latest
    container_name: gmd-adminer-dev
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: gmd-mailhog-dev
    restart: unless-stopped
    ports:
      - '${MAILHOG_SMTP_PORT:-1025}:1025'
      - '${MAILHOG_UI_PORT:-8025}:8025'

  coturn:
    image: coturn/coturn:4.6
    container_name: gmd-coturn-dev
    restart: unless-stopped
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-dev-secret-change-me}
      TURN_REALM: ${TURN_REALM:-gmd.local}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-127.0.0.1}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - turnserver
      - -c
      - /etc/coturn/turnserver.conf
      - --no-cli
      - --static-auth-secret=${TURN_SHARED_SECRET:-dev-secret-change-me}
      - --realm=${TURN_REALM:-gmd.local}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
    ports:
      - '3478:3478/tcp'
      - '3478:3478/udp'
      - '49152-49200:49152-49200/udp'

volumes:
  postgres_data:
  redis_data:
  minio_data:
