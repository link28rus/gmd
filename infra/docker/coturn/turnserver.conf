# coturn config — GMD «Звук вокруг ребёнка»
# Documentation: https://github.com/coturn/coturn/blob/master/examples/etc/turnserver.conf
#
# Auth — REST API (RFC 5766). Backend генерирует:
#   username = <unix_ts_expiry>:<session_id>
#   password = base64(HMAC_SHA1(static-auth-secret, username))
# coturn проверяет HMAC локально, в БД ходить не надо.
#
# realm и static-auth-secret задаются через CLI в docker-compose (envsubst
# не работает в этом конфиг-файле; coturn умеет читать только plain values).
# external-ip тоже передаётся из CLI: разный для dev/prod.

listening-port=3478
tls-listening-port=5349

listening-ip=0.0.0.0

# Auth (RFC 5766 REST)
use-auth-secret

# ⚠ Этот range синхронизирован с port-mapping в infra/docker/docker-compose.{dev,prod}.yml.
# Если меняешь — меняй в обоих местах, иначе coturn будет аллокатить порты,
# которые не пробрасываются, и relay молча сломается.
min-port=49152
max-port=49200

# Quota
total-quota=100
user-quota=4
max-bps=64000

no-cli

# Hardening: запрет relay в private/internal сети.
# Без этого TURN можно использовать как SSRF-прокси к Postgres/Redis/MinIO в той
# же docker-network или к AWS/GCP metadata-сервису 169.254.169.254. Конфиг
# переиспользуется в prod, поэтому защита нужна с самого начала.
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# allow loopback для dev-тестов turnutils_uclient
# (127.0.0.0/8 попадает под denied-peer-ip=0.0.0.0-0.255.255.255, allow перебивает deny)
allowed-peer-ip=127.0.0.1

# Прочие protocol-tightening
no-tlsv1
no-tlsv1_1
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Debug
log-file=stdout
fingerprint
