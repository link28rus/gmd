# Production docker-compose для GMD (192.168.1.23 / gmd.link28rus.ru).
# Запуск с сервера: cd /opt/gmd && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Все bind-mounts лежат в /opt/gmd/data/<service>/.
# Наружу открыты только caddy:80/443 (проверяется UFW).
#
# Phase 0.4: GlitchTip (postgres+redis: Task 1, web+worker: Task 2) и Uptime Kuma (Task 3).

name: gmd-prod

x-restart: &restart
  restart: unless-stopped

# Log-rotation для всех сервисов: max 50MB на файл, 3 файла на контейнер
# (= cap 150MB/контейнер, 11 контейнеров = max 1.65GB логов). Без этого
# json-driver хранит всё в одном файле без ограничений — после серии rebuild'ов
# контейнерные логи росли до сотен MB и съедали место (см. cleanup 2026-04-28).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '50m'
      max-file: '3'

networks:
  gmd_net:
    driver: bridge

services:
  postgres:
    <<: [*restart, *logging]
    build:
      context: ./postgres
    image: gmd-postgres:16-postgis-pgcron
    container_name: gmd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB}
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - log_min_duration_statement=500
    volumes:
      - /opt/gmd/data/postgres:/var/lib/postgresql/data
      - ./postgres/10-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./postgres/20-retention.sql:/docker-entrypoint-initdb.d/20-retention.sql:ro
    networks: [gmd_net]
    # Наружу не светим: доступ только через `docker exec` или SSH-tunnel (152-ФЗ)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    container_name: gmd-redis
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /opt/gmd/data/redis:/data
    networks: [gmd_net]
    # Наружу не светим
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    <<: [*restart, *logging]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: gmd-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /opt/gmd/data/minio:/data
    networks: [gmd_net]
    # MinIO console при необходимости — через SSH-tunnel (ssh -L 9001:minio:9001 gmd-prod)
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  glitchtip-postgres:
    <<: [*restart, *logging]
    image: postgres:15-alpine
    container_name: gmd-glitchtip-postgres
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
    volumes:
      - /opt/gmd/data/glitchtip-postgres:/var/lib/postgresql/data
    networks: [gmd_net]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glitchtip -d glitchtip']
      interval: 10s
      timeout: 3s
      retries: 5

  glitchtip-redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    container_name: gmd-glitchtip-redis
    command: ['redis-server', '--requirepass', '${GLITCHTIP_REDIS_PASSWORD}', '--appendonly', 'yes']
    environment:
      REDIS_PASSWORD: ${GLITCHTIP_REDIS_PASSWORD}
    volumes:
      - /opt/gmd/data/glitchtip-redis:/data
    networks: [gmd_net]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  glitchtip-web:
    <<: [*restart, *logging]
    image: glitchtip/glitchtip:v4.0
    container_name: gmd-glitchtip-web
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://:${GLITCHTIP_REDIS_PASSWORD}@glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      ENABLE_USER_REGISTRATION: ${GLITCHTIP_ENABLE_USER_REGISTRATION}
      ENABLE_ORGANIZATION_CREATION: 'False'
      EVENT_RETENTION_DAYS: ${GLITCHTIP_EVENT_RETENTION_DAYS}
      CELERY_WORKER_CONCURRENCY: ${GLITCHTIP_CELERY_WORKER_CONCURRENCY}
      PORT: '8000'
    volumes:
      - /opt/gmd/data/glitchtip-uploads:/code/uploads
    depends_on:
      glitchtip-postgres: { condition: service_healthy }
      glitchtip-redis: { condition: service_healthy }
    networks: [gmd_net]
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      # GlitchTip v4 образ без wget/curl — используем python3 stdlib.
      # /_health/ — встроенный django endpoint (возвращает 200 OK).
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/_health/',timeout=3); sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  glitchtip-worker:
    <<: [*restart, *logging]
    image: glitchtip/glitchtip:v4.0
    container_name: gmd-glitchtip-worker
    command: ['./bin/run-celery-with-beat.sh']
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://:${GLITCHTIP_REDIS_PASSWORD}@glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      EVENT_RETENTION_DAYS: ${GLITCHTIP_EVENT_RETENTION_DAYS}
      CELERY_WORKER_CONCURRENCY: ${GLITCHTIP_CELERY_WORKER_CONCURRENCY}
    volumes:
      - /opt/gmd/data/glitchtip-uploads:/code/uploads
    depends_on:
      glitchtip-postgres: { condition: service_healthy }
      glitchtip-redis: { condition: service_healthy }
      glitchtip-web: { condition: service_healthy }
    networks: [gmd_net]

  uptime-kuma:
    <<: [*restart, *logging]
    image: louislam/uptime-kuma:1
    container_name: gmd-uptime-kuma
    volumes:
      - /opt/gmd/data/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [gmd_net]
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      # Uptime Kuma предоставляет native healthcheck binary — /app/extra/healthcheck.
      # wget в этом образе нет, поэтому используем встроенный скрипт.
      test: ['CMD', 'extra/healthcheck']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # coturn удалён в v0.35.0-rc.4 (Phase 4 Plan E pivot). Ранее использовался для
  # WebRTC TURN-relay в фиче «Звук вокруг ребёнка», но WebRTC заменён на серверный
  # WebSocket-relay (см. CHANGELOG v0.35.0-rc.1..rc.3). При апдейте до v0.35.0:
  # на prod обязательно сделать `docker compose down coturn && docker rmi coturn/coturn:4.6`,
  # удалить /opt/gmd/coturn/, snять с UFW правила 3478/49152-49200.

  backend:
    <<: [*restart, *logging]
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    image: gmd-backend:latest
    container_name: gmd-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-3}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-1.0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-GMD <no-reply@gmd.link28rus.ru>}
      SMTP_SECRET_KEY: ${SMTP_SECRET_KEY:-}
      OTP_LOG_DEV: ${OTP_LOG_DEV:-false}
      OTP_FIXED_DEV: ${OTP_FIXED_DEV:-}
      INVITE_TTL_SECONDS: ${INVITE_TTL_SECONDS:-600}
      CLAIM_LANDING_BASE_URL: ${CLAIM_LANDING_BASE_URL:-https://gmd.link28rus.ru}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-false}
      AUTH_DEV_SECRET: ${AUTH_DEV_SECRET:-}
      PASSWORD_LOCK_AFTER: ${PASSWORD_LOCK_AFTER:-5}
      PASSWORD_LOCK_TTL_SECONDS: ${PASSWORD_LOCK_TTL_SECONDS:-900}
      SENTRY_DSN: ${SENTRY_DSN_BACKEND}
      PORT: '3001'
      AUDIO_WS_SECRET: ${AUDIO_WS_SECRET}
      AUDIO_WS_PUBLIC_URL: ${AUDIO_WS_PUBLIC_URL:-wss://gmd.link28rus.ru/audio/ws}
      # v0.37: FCM service-account JSON (base64-encoded). Если не задан —
      # FcmService стартует в DISABLED состоянии, push не отправляется,
      # backend fallback'ится на poll-команды через DeviceCommand queue.
      FIREBASE_SA_KEY: ${FIREBASE_SA_KEY:-}
    volumes:
      - /opt/gmd/secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - /opt/gmd/secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [gmd_net]
    expose: ['3001']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:3001/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    <<: [*restart, *logging]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
    image: gmd-web:latest
    container_name: gmd-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_WEB}
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-}
      BACKEND_URL: http://backend:3001
      ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-false}
      DOWNLOAD_DIR: /srv/download
    volumes:
      - /opt/gmd/download:/srv/download:ro
    depends_on:
      backend: { condition: service_healthy }
    networks: [gmd_net]
    expose: ['3000']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:3000/api/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    <<: [*restart, *logging]
    image: caddy:2-alpine
    container_name: gmd-caddy
    ports:
      - '80:80'
      # v0.35.0-rc.4: Caddy сам терминирует TLS на 95.104.240.111:443 (ACME через :80).
      # До этого TLS делал внешний nginx 1.24.0 на 95.104.240.99 (через router),
      # после Plan E DNS gmd.link28rus.ru → 95.104.240.111 (ens192 direct), нужен
      # отдельный TLS-listener.
      - '443:443'
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH}
      DOWNLOAD_PASSWORD_HASH: ${DOWNLOAD_PASSWORD_HASH}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/gmd/data/caddy/data:/data
      - /opt/gmd/data/caddy/config:/config
      - /opt/gmd/download:/srv/download:ro
    depends_on:
      - web
      - backend
    networks: [gmd_net]
    # healthcheck пропускаем: в caddy:2-alpine нет ни wget ни curl.
    # Caddy сам логирует TLS-handshake и reverse-proxy ошибки в stdout.
