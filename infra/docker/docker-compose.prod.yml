# Production docker-compose для GMD (192.168.1.23 / gmd.link28rus.ru).
# Запуск с сервера: cd /opt/gmd && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Все bind-mounts лежат в /opt/gmd/data/<service>/.
# Наружу открыты только caddy:80/443 (проверяется UFW).
#
# GlitchTip (Task 16) и Uptime Kuma (Task 17) добавляются в следующих задачах.

name: gmd-prod

x-restart: &restart
  restart: unless-stopped

networks:
  gmd_net:
    driver: bridge

services:
  postgres:
    <<: *restart
    build:
      context: ./postgres
    image: gmd-postgres:16-postgis-pgcron
    container_name: gmd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB}
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - log_min_duration_statement=500
    volumes:
      - /opt/gmd/data/postgres:/var/lib/postgresql/data
      - ./postgres/10-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./postgres/20-retention.sql:/docker-entrypoint-initdb.d/20-retention.sql:ro
    networks: [gmd_net]
    # Наружу не светим: доступ только через `docker exec` или SSH-tunnel (152-ФЗ)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    <<: *restart
    image: redis:7-alpine
    container_name: gmd-redis
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /opt/gmd/data/redis:/data
    networks: [gmd_net]
    # Наружу не светим
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    <<: *restart
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: gmd-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /opt/gmd/data/minio:/data
    networks: [gmd_net]
    # MinIO console при необходимости — через SSH-tunnel (ssh -L 9001:minio:9001 gmd-prod)
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    <<: *restart
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    image: gmd-backend:latest
    container_name: gmd-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-3}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-1.0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-GMD <no-reply@gmd.link28rus.ru>}
      OTP_LOG_DEV: ${OTP_LOG_DEV:-false}
      OTP_FIXED_DEV: ${OTP_FIXED_DEV:-}
      INVITE_TTL_SECONDS: ${INVITE_TTL_SECONDS:-600}
      CLAIM_LANDING_BASE_URL: ${CLAIM_LANDING_BASE_URL:-https://gmd.link28rus.ru}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SENTRY_DSN: ${SENTRY_DSN_BACKEND}
      PORT: '3001'
    volumes:
      - /opt/gmd/secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - /opt/gmd/secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [gmd_net]
    expose: ['3001']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:3001/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    <<: *restart
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: gmd-web:latest
    container_name: gmd-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_WEB}
      BACKEND_URL: http://backend:3001
      ALLOW_INSECURE_COOKIE: ${ALLOW_INSECURE_COOKIE:-false}
    depends_on:
      backend: { condition: service_healthy }
    networks: [gmd_net]
    expose: ['3000']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:3000/api/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    <<: *restart
    image: caddy:2-alpine
    container_name: gmd-caddy
    ports:
      - '80:80'
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/gmd/data/caddy/data:/data
      - /opt/gmd/data/caddy/config:/config
    depends_on:
      - web
      - backend
    networks: [gmd_net]
    # healthcheck пропускаем: в caddy:2-alpine нет ни wget ни curl.
    # Caddy сам логирует TLS-handshake и reverse-proxy ошибки в stdout.
