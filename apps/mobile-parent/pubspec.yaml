name: gmd_parent
description: "GMD — приложение родителя"
publish_to: 'none'
version: 0.44.1+1

environment:
  sdk: ^3.11.5
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.0

  # HTTP
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Routing
  go_router: ^14.6.0

  # Map (OpenStreetMap через flutter_map — бесплатно, без ключа, без санкционных
  # рисков. Tile-сервер по умолчанию tile.openstreetmap.org.)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1

  # Misc
  intl: ^0.19.0
  package_info_plus: ^8.1.0
  device_info_plus: ^11.1.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
