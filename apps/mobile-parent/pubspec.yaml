name: periscop_parent
description: "Перископ Родителя — родительский контроль и геолокация ребёнка"
publish_to: 'none'
version: 0.73.2+46

environment:
  sdk: ^3.11.5
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Русская локализация для встроенных виджетов (DatePicker, MaterialLocalizations).
  # Без него DatePicker отрисуется на английском даже в RU-системе.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.0

  # HTTP
  dio: ^5.7.0

  # Storage. SharedPreferences (а не flutter_secure_storage) для токенов:
  # на Android 14/15 MIUI flutter_secure_storage 9.x теряет EncryptedSharedPreferences
  # MasterKey после перезапуска — все ключи возвращают null. См. lesson в memory-compiler.
  shared_preferences: ^2.3.2

  # Routing
  go_router: ^14.6.0

  # Map (OpenStreetMap через flutter_map — бесплатно, без ключа, без санкционных
  # рисков. Tile-сервер по умолчанию tile.openstreetmap.org.)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Misc
  # 0.20.x — требуется flutter_localizations (SDK pin'нит intl=0.20.2).
  intl: ^0.20.2
  package_info_plus: ^8.1.0
  device_info_plus: ^11.1.0
  connectivity_plus: ^6.0.5

  # v0.46: Firebase Cloud Messaging — push для событий геозон / SOS / низкого заряда.
  # Versions согласованы с mobile-child (firebase-bom 34.12.0 в gradle).
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  permission_handler: ^11.3.1

  # v0.47: WebView для встроенного экрана «Звук вокруг ребёнка». На MVP
  # проигрываем поток через web-плеер (Opus → AudioWorklet → MediaStream),
  # потом можно заменить на нативный декодер.
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0

  # QR-коды для экрана «Добавить ребёнка» (показываем invite QR, ребёнок
  # сканирует в mobile-child).
  qr_flutter: ^4.1.0

  # v0.51: `flutter_rustore_push` — параллельный FCM транспорт push'ей; нужен
  # для устройств без Google Play Services (HMS Huawei, чистые AOSP). Backend
  # выбирает канал по deviceCapabilities, см. push.service.ts.
  # `flutter_rustore_update` (In-App Update SDK) удалён в v0.56.0: RuStore на
  # паузе, обновления — самообновлением с нашего сервера (AppUpdater.kt).
  flutter_rustore_push: ^7.2.0

  # v0.61: аватары детей — стандартные зверята (SVG) и своё фото из галереи/камеры
  # (сжатие на клиенте через maxWidth/imageQuality, см. child_avatar_sheet.dart).
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3

  # v0.66: кнопка «Где я» на карте геозон — одна точка по нажатию, грубая
  # точность (ACCESS_COARSE_LOCATION). Фоновый сервис плагина вычищен из
  # манифеста (tools:node="remove").
  geolocator: ^14.0.2

  # v0.71: системное «Поделиться» для приглашения взрослого в семью.
  share_plus: ^12.0.2

  # v0.72: экран принятия политики — ссылки на /privacy и /terms во внешнем браузере.
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  # Нативный splash (до старта Flutter-движка) — убирает белый кадр на cold
  # start. Генерирует Android-ресурсы: `dart run flutter_native_splash:create`.
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    # v0.61: стандартные аватары детей (генератор tools/avatars/generate_presets.py).
    - assets/avatars/

# Нативная заставка — брендовый зелёный фон + логотип «Перископ» (foreground
# адаптивной иконки). Показывается ОС до инициализации Flutter, затем виджет
# SplashScreen продолжает брендовую заставку. Регенерация после правок:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#2E7D32"
  image: assets/icon/icon.png
  android_12:
    color: "#2E7D32"
    image: assets/icon/icon.png
  android: true
  ios: false
  web: false
