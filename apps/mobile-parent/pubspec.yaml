name: gmd_parent
description: "GMD — приложение родителя"
publish_to: 'none'
version: 0.46.4+20

environment:
  sdk: ^3.11.5
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.0

  # HTTP
  dio: ^5.7.0

  # Storage. SharedPreferences (а не flutter_secure_storage) для токенов:
  # на Android 14/15 MIUI flutter_secure_storage 9.x теряет EncryptedSharedPreferences
  # MasterKey после перезапуска — все ключи возвращают null. См. lesson в memory-compiler.
  shared_preferences: ^2.3.2

  # Routing
  go_router: ^14.6.0

  # Map (OpenStreetMap через flutter_map — бесплатно, без ключа, без санкционных
  # рисков. Tile-сервер по умолчанию tile.openstreetmap.org.)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Misc
  intl: ^0.19.0
  package_info_plus: ^8.1.0
  device_info_plus: ^11.1.0
  connectivity_plus: ^6.0.5

  # v0.46: Firebase Cloud Messaging — push для событий геозон / SOS / низкого заряда.
  # Versions согласованы с mobile-child (firebase-bom 34.12.0 в gradle).
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  permission_handler: ^11.3.1

  # v0.47: WebView для встроенного экрана «Звук вокруг ребёнка». На MVP
  # проигрываем поток через web-плеер (Opus → AudioWorklet → MediaStream),
  # потом можно заменить на нативный декодер.
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
