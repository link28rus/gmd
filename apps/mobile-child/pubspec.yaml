name: gmd_child
description: "Перископ — приложение ребёнка"
publish_to: 'none'
version: 0.52.0+6091

environment:
  sdk: ^3.11.5
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.0
  dio: ^5.7.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  connectivity_plus: ^6.0.5
  device_info_plus: ^11.1.0
  package_info_plus: ^8.1.0
  go_router: ^14.6.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  gmd_shared:
    path: ../../packages/shared-dart
  intl: ^0.19.0
  record: ^6.2.0
  opus_dart: ^3.0.1
  opus_flutter: ^3.0.3
  web_socket_channel: ^3.0.3

  # v0.51: RuStore SDKs — единственный канал distribution для РФ-рынка
  # (lessons #24 + #26). `flutter_rustore_push` — параллельный FCM транспорт
  # push'ей; нужен для устройств без Google Play Services (HMS Huawei, чистые
  # AOSP, MIUI без GMS) — backend выбирает канал по deviceCapabilities,
  # см. push.service.ts. `flutter_rustore_update` — In-App Update SDK
  # (закрывает lesson #23: MIUI не сбрасывает permissions при update через
  # trusted store API). С v0.50.4 — без fallback'а на ACTION_VIEW: RuStore
  # модерация требует, чтобы все обновления шли централизованно через store.
  flutter_rustore_push: ^7.2.0
  flutter_rustore_update: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
