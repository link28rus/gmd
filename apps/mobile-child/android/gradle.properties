org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# v0.35.0-rc.3: opus_flutter_android subproject объявляет minSdk=19 в своём
# build.gradle (legacy default), но содержит native CXX-код, требующий NDK ≥ 21.
# Наш app minSdk=26, поэтому сборка фактически безопасна на 21+ — suppression
# подавляет фейл валидации.
android.ndk.suppressMinSdkVersionError=21
