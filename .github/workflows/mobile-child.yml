name: mobile-child CI

on:
  pull_request:
    paths:
      - 'apps/mobile-child/**'
      - 'packages/shared-dart/**'
      - '.github/workflows/mobile-child.yml'
  push:
    branches: [main, 'feature/**']
    paths:
      - 'apps/mobile-child/**'
      - 'packages/shared-dart/**'
      - '.github/workflows/mobile-child.yml'

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Та же версия, что локально собирает релизные APK. Без пина CI брал
          # свежий stable, и новый анализатор падал на том, чего нет локально.
          # Обновлять вместе с локальным Flutter.
          flutter-version: '3.41.7'
          cache: true

      - name: flutter pub get (mobile-child)
        working-directory: apps/mobile-child
        run: flutter pub get

      - name: flutter analyze
        working-directory: apps/mobile-child
        run: flutter analyze

      - name: flutter test
        working-directory: apps/mobile-child
        run: flutter test

      # google-services.json в .gitignore (с v0.37, FCM), без него плагин
      # google-services роняет сборку. Для debug-сборки в CI хватает заглушки
      # с тем же package — FCM в CI не нужен, настоящие ключи не требуются.
      - name: google-services.json (заглушка для CI)
        working-directory: apps/mobile-child/android/app
        run: |
          [ -f google-services.json ] || cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "periscop-ci-stub",
              "storage_bucket": "periscop-ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "pro.periscop.child" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-stub" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: flutter build apk --debug
        working-directory: apps/mobile-child
        run: flutter build apk --debug
