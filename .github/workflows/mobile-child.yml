name: mobile-child CI

on:
  pull_request:
    paths:
      - 'apps/mobile-child/**'
      - 'packages/shared-dart/**'
      - '.github/workflows/mobile-child.yml'
  push:
    branches: [main, 'feature/**']
    paths:
      - 'apps/mobile-child/**'
      - 'packages/shared-dart/**'
      - '.github/workflows/mobile-child.yml'

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: flutter pub get (mobile-child)
        working-directory: apps/mobile-child
        run: flutter pub get

      - name: flutter analyze
        working-directory: apps/mobile-child
        run: flutter analyze

      - name: flutter test
        working-directory: apps/mobile-child
        run: flutter test

      - name: flutter build apk --debug
        working-directory: apps/mobile-child
        run: flutter build apk --debug
